{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block body_class %}example-fullscreen{% endblock %}

{% block content %}
<div class="example-page">
    <div class="example-page__bar">
        <a href="/examples/" class="example-page__back" aria-label="Back to examples">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"/>
            </svg>
            <span>Examples</span>
        </a>
        <span class="example-page__title">{{ page.title }}</span>
        {% if page.extra.github %}
        <a href="{{ page.extra.github }}" class="example-page__code" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="16 18 22 12 16 6"/>
                <polyline points="8 6 2 12 8 18"/>
            </svg>
            <span>Code</span>
        </a>
        {% endif %}
    </div>
    <iframe
        class="example-page__frame"
        src="/examples/shell.html?id={{ page.extra.example_id }}"
        loading="eager"
        allow="autoplay"
        tabindex="0"></iframe>
</div>
{% endblock %}

{% block footer %}{% endblock %}
