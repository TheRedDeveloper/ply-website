<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ply Interactive Demo</title>
    <style>
        @font-face {
            font-family: 'Geist Mono';
            font-style: normal;
            font-weight: 100 900;
            src: url('../fonts/GeistMono-Variable.woff2') format('woff2-variations'),
                 url('../fonts/GeistMono-Variable.woff2') format('woff2');
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #1a1111; overflow: hidden; }

        .demo-container {
            display: flex;
            height: 100%;
            gap: 0;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-right: 1px solid #2E2A28;
        }

        .editor-header {
            background: #181515;
            color: #9E9590;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            padding: 6px 12px;
            border-bottom: 1px solid #2E2A28;
            user-select: none;
        }

        #editor-container {
            flex: 1;
            overflow: auto;
        }

        /* CodeMirror overrides to fill the pane */
        #editor-container .cm-editor {
            height: 100%;
        }
        #editor-container .cm-scroller {
            overflow: auto;
        }

        .canvas-pane {
            flex: 1;
            display: flex;
            align-items: stretch;
            min-width: 0;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Fallback textarea while CodeMirror loads */
        #fallback-editor {
            width: 100%;
            height: 100%;
            background: #1a1111;
            color: #E8E0DC;
            font-family: 'Geist Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 12px;
            border: none;
            outline: none;
            resize: none;
            tab-size: 4;
        }

        /* Warm Ply theme overrides for CodeMirror */
        .cm-editor {
            background: #1a1111 !important;
        }
        .cm-editor .cm-scroller {
            font-family: 'Geist Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
        }
        .cm-editor .cm-gutters {
            background: #1a1111 !important;
            border-right: 1px solid #2E2A28 !important;
            color: #5E5854 !important;
        }
        .cm-editor .cm-activeLineGutter {
            background: rgba(255, 101, 77, 0.08) !important;
        }
        .cm-editor .cm-activeLine {
            background: rgba(255, 101, 77, 0.06) !important;
        }
        .cm-editor .cm-cursor, .cm-editor .cm-dropCursor {
            border-left-color: #FF654D !important;
        }
        .cm-editor .cm-selectionBackground,
        .cm-editor.cm-focused .cm-selectionBackground,
        .cm-editor ::selection {
            background: rgba(255, 101, 77, 0.2) !important;
        }
        .cm-editor .cm-selectionMatch {
            background: rgba(255, 195, 44, 0.12) !important;
        }
        .cm-editor .cm-matchingBracket {
            background: rgba(255, 195, 44, 0.2) !important;
            color: #FFC32C !important;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="editor-pane">
            <div class="editor-header">editor</div>
            <div id="editor-container">
                <textarea id="fallback-editor" spellcheck="false"></textarea>
            </div>
        </div>
        <div class="canvas-pane">
            <canvas id="glcanvas" tabindex="-1"></canvas>
        </div>
    </div>

    <!-- miniquad GL loader + ply_demo plugin -->
    <script src="ply_bundle.js"></script>

    <script>
        // Register service worker for WASM caching
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' });
        }

        // Load WASM
        load("app-v3.wasm");
    </script>

    <!-- CodeMirror 6 (bundled locally via esbuild) -->
    <script src="codemirror-bundle.js"></script>
    <script>
        // Remove fallback textarea and set up CodeMirror
        var fb = document.getElementById('fallback-editor');
        if (fb) fb.remove();

        var view = new CM.EditorView({
            state: CM.EditorState.create({
                doc: DEFAULT_CODE,
                extensions: [
                    ...CM.minimalSetup,
                    CM.rust(),
                    CM.oneDark,
                    CM.EditorView.updateListener.of(function (update) {
                        if (update.docChanged) {
                            ply_demo_set_code(update.state.doc.toString());
                        }
                    }),
                ],
            }),
            parent: document.getElementById('editor-container'),
        });
    </script>
